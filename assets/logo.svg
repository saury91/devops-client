<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scan Line Pattern -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.12)"/>
    </pattern>

    <!-- Hex Grid Pattern -->
    <pattern id="hexgrid" x="0" y="0" width="48" height="83.14" patternUnits="userSpaceOnUse">
      <path d="M24 0 L48 13.86 L48 41.57 L24 55.43 L0 41.57 L0 13.86 Z" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="0.8"/>
      <path d="M24 83.14 L48 69.28 L48 41.57" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="0.8"/>
      <path d="M0 41.57 L0 69.28 L24 83.14" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="0.8"/>
    </pattern>

    <!-- Gradient: Cyan to Blue -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>

    <!-- Gradient: Dark surface -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B2E"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Corner Accent Gradient -->
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="rgba(0,229,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Square -->
  <rect x="64" y="64" width="896" height="896" rx="128" ry="128" fill="url(#bgGrad)"/>

  <!-- Hex Grid Overlay -->
  <rect x="64" y="64" width="896" height="896" rx="128" ry="128" fill="url(#hexgrid)"/>

  <!-- Scan Lines -->
  <rect x="64" y="64" width="896" height="896" rx="128" ry="128" fill="url(#scanlines)"/>

  <!-- Circuit Trace Lines -->
  <g opacity="0.12" stroke="#00E5FF" stroke-width="1" fill="none">
    <!-- Left circuit -->
    <polyline points="64,256 160,256 160,320 224,320"/>
    <!-- Right circuit -->
    <polyline points="960,768 864,768 864,704 800,704"/>
    <!-- Top circuit dot -->
    <circle cx="256" cy="128" r="4" fill="#00E5FF"/>
    <!-- Bottom circuit dot -->
    <circle cx="768" cy="896" r="4" fill="#00E5FF"/>
  </g>

  <!-- Central Geometric Frame -->
  <g transform="translate(512, 420)" opacity="0.25">
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"
             fill="none" stroke="#00E5FF" stroke-width="1.5"/>
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70"
             fill="none" stroke="#00E5FF" stroke-width="0.8"/>
  </g>

  <!-- DEVOPS Text with Neon Glow -->
  <g filter="url(#glow)">
    <text x="512" y="420" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','SF Pro Display',-apple-system,sans-serif"
          font-weight="700" font-size="152" letter-spacing="18"
          fill="url(#cyanGrad)">DEVOPS</text>
  </g>

  <!-- Subtitle -->
  <text x="512" y="530" text-anchor="middle" dominant-baseline="central"
        font-family="'SF Mono','JetBrains Mono','Cascadia Code',monospace"
        font-weight="400" font-size="28" letter-spacing="14"
        fill="#64748B" opacity="0.7">CLIENT</text>

  <!-- Bottom Tech Decor -->
  <g transform="translate(512, 600)" opacity="0.5">
    <line x1="-120" y1="0" x2="-60" y2="0" stroke="#00E5FF" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#00E5FF"/>
    <line x1="60" y1="0" x2="120" y2="0" stroke="#00E5FF" stroke-width="0.8"/>
  </g>

  <!-- Status Dots (cyberpunk indicator lights) -->
  <g transform="translate(512, 660)">
    <circle cx="-48" cy="0" r="5" fill="#00E5FF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="0" r="5" fill="#00E5FF" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Version Tag -->
  <text x="512" y="720" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono',monospace"
        font-weight="400" font-size="20" letter-spacing="4"
        fill="#64748B" opacity="0.35">SECURE DEVICE AGENT</text>
</svg>
