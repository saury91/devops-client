name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    # One job per OS, because every platform backend is behind `cfg(target_os)` and therefore only
    # ever compiled on its own runner: `linux.rs` on ubuntu, `macos.rs` on macOS, `win.rs` on
    # Windows. A single ubuntu job leaves two thirds of the certificate code unchecked, which is
    # exactly where a review-free edit is most likely to slip through.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        if: matrix.platform == 'ubuntu-latest'
        with:
          node-version: 24

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Formatting is platform independent, so it runs once instead of three times.
      - name: rustfmt
        if: matrix.platform == 'ubuntu-latest'
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: test
        run: cargo test
        working-directory: src-tauri

      # The frontend is served straight from `src/` with no bundler, so nothing else would catch a
      # syntax error before it reaches the webview.
      - name: frontend syntax
        if: matrix.platform == 'ubuntu-latest'
        run: |
          find src/js -name '*.js' -print0 | xargs -0 -n1 node --check

  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (PR only)
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Build Tauri and create release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "DevOps Client v__VERSION__"
          releaseBody: |
            ## Install

            **macOS**: Download the `.dmg` file, open it, and drag `DevOps Client.app` to `/Applications`.
            If you see "app is damaged", run this in Terminal:
            ```
            xattr -cr "/Applications/DevOps Client.app"
            ```

            **Windows**: Download the `.msi` installer and run it.

            **Linux**: Download the `.deb` or `.AppImage` file and install with your package manager.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
