[package]
name = "devops-client"
version = "0.1.16"
edition = "2021"
license = "MIT"
# 本仓库代码实际用到的最高要求：`std::sync::LazyLock`（1.80）与 `Option::is_none_or`（1.82）。
# 它是 `clippy::incompatible_msrv` 的输入 —— 写了这一行，CI 就会在有人误用更高版本 API 时
# 直接报错，而不是等某个用旧工具链的同事在本地撞上。
rust-version = "1.82"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
argon2 = "0.5"
aes-gcm = "0.10"
base64ct = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
dirs = "5"
hostname = "0.4"

# 只有 macOS 需要额外 feature，因此单独声明一条 target 依赖。
[target.'cfg(target_os = "macos")'.dependencies]
# `macos-private-api` 让窗口支持透明背景。与上面 [dependencies] 里的 tauri 是同一个包，
# cargo 会把两处的 feature 取并集（tray-icon + image-png + macos-private-api）。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
