[package]
name = "devops-client"
version = "0.1.16"
edition = "2021"
license = "MIT"
# 本仓库代码实际用到的最高要求：`std::sync::LazyLock`（1.80）与 `Option::is_none_or`（1.82）。
# 它是 `clippy::incompatible_msrv` 的输入 —— 写了这一行，CI 就会在有人误用更高版本 API 时
# 直接报错，而不是等某个用旧工具链的同事在本地撞上。
rust-version = "1.82"

[dependencies]
# 不要加 macos-private-api：那套私有 API 会让 macOS 版上不了 App Store。
# macOS 的圆角/阴影改用系统窗口边框实现（见 src/main.rs 的建窗分支）。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
argon2 = "0.5"
aes-gcm = "0.10"
base64ct = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
dirs = "5"
hostname = "0.4"

# 只有 macOS 需要额外依赖，因此单独声明 target 段。
[target.'cfg(target_os = "macos")'.dependencies]
# 隐藏固定尺寸窗口的绿色缩放按钮用（standardWindowButton + setHidden）。
# objc2-app-kit 已在依赖树里（tao 依赖它），版本对齐避免重复编译。
# 全部是公开 AppKit API，不影响 App Store 上架。
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView", "NSResponder"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
